<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>APRFlow · Documentos</title>
<link rel="icon" href="assets/img/icone.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<div class="shell">
  <header class="top"><div class="in g">
    <a class="brand" href="app.html" style="text-decoration:none;color:inherit"><b>APRFlow</b><span>Análise de Riscos · Permissão de Trabalho</span></a>
    <div class="sp"></div>
    <nav style="display:flex;gap:4px">
      <a class="tlink on" href="app.html">Documentos</a>
      <a class="tlink" href="admin.html" id="lnkAdmin">Administração</a>
    </nav>
    <div class="who"><b id="whoNome">…</b><span id="whoInfo"></span></div>
    <button class="tbtn" id="bSair">Sair</button>
  </div></header>

  <!-- Lista de documentos -->
  <div id="vList" class="scroll">
    <main class="g" style="padding-block:20px 40px">
      <div class="wrap">
        <div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px">
          <h2 style="margin:0;flex:1">Documentos</h2>
          <button class="btn pri big" id="bNovo" hidden>+ Nova APR / PT</button>
        </div>
        <div class="toolbar">
          <input type="text" class="grow" id="busca" placeholder="Buscar por número, serviço, local ou empresa" aria-label="Buscar documentos">
          <div class="filters" id="filtros" role="group" aria-label="Filtrar por situação"></div>
        </div>
        <div id="lista"><div class="empty">Carregando documentos…</div></div>
      </div>
    </main>
  </div>

  <!-- Editor -->
  <div id="vEdit" class="app" hidden>
    <div class="docbar"><div class="in g">
      <button class="btn ghost" data-act="voltar">← Documentos</button>
      <span class="docno" id="docno"></span>
      <span class="chip" id="chip">Rascunho</span>
      <span class="savest" id="savest" aria-live="polite"></span>
      <span class="sp"></span>
      <button class="btn" data-act="duplicar" id="bDuplicar" hidden>Duplicar</button>
      <button class="btn pendbtn" data-act="pend" id="pendbtn">Pendências</button>
    </div></div>
    <nav class="tabs" aria-label="Etapas"><div class="in g" id="tabs" role="tablist"></div></nav>
    <div class="work">
      <main class="panel g" id="panel"></main>
      <aside class="side" id="side" aria-label="Resumo e pendências"></aside>
    </div>
    <footer class="foot"><div class="in g">
      <button class="btn" data-act="prev" id="bPrev">← Anterior</button>
      <span class="step" id="step"></span>
      <button class="btn pri" data-act="next" id="bNext">Próximo →</button>
    </div></footer>

    <div class="modal" id="sigModal" hidden>
      <div class="card" role="dialog" aria-modal="true" aria-labelledby="sigTitle">
        <div><h2 id="sigTitle">Assinatura</h2><p class="hint" id="sigSub" style="margin:0">Assine com o dedo ou o mouse no quadro abaixo.</p></div>
        <canvas id="sigCanvas"></canvas>
        <div class="acts">
          <button class="btn ghost" data-act="sigClear">Limpar</button>
          <button class="btn" data-act="sigCancel">Cancelar</button>
          <button class="btn pri" data-act="sigSave">Confirmar assinatura</button>
        </div>
      </div>
    </div>

    <div class="modal" id="dlg" hidden>
      <div class="card dlg" role="alertdialog" aria-modal="true">
        <h2 class="dlg-t">Atenção</h2>
        <div class="dlg-b"></div>
        <div class="acts"><button class="btn pri" data-act="dlgFechar">Entendi</button></div>
      </div>
    </div>
  </div>
</div>

<!-- Novo documento (administrador escolhe o cliente) -->
<div class="modal" id="novoDlg" hidden>
  <form class="card" id="fNovo" role="dialog" aria-modal="true" aria-labelledby="novoT">
    <h2 id="novoT">Nova APR / PT</h2>
    <label class="fld"><span>Cliente</span><select id="novoCliente"></select></label>
    <div class="acts">
      <button class="btn" type="button" id="novoCancelar">Cancelar</button>
      <button class="btn pri" type="submit">Criar documento</button>
    </div>
  </form>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/editor.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
