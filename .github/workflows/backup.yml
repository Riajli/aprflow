# Backup semanal do banco, criptografado com senha.
# O arquivo fica em Actions → (execução) → Artifacts por 90 dias.
# Precisa dos segredos SUPABASE_DB_URL (Connection string, modo Session pooler)
# e BACKUP_SENHA (senha usada para criptografar; guarde-a em lugar seguro).
name: Backup do banco
on:
  schedule:
    - cron: "30 6 * * 0"    # todo domingo às 03:30 (Brasília)
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Exportar o banco
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          URL="$(printf '%s' "$DB_URL" | tr -d '[:space:]')"
          case "$URL" in
            postgres://*|postgresql://*) ;;
            *) echo "::error::O segredo SUPABASE_DB_URL está vazio ou não começa com postgresql://. Copie de novo o endereço do Session pooler."; exit 1 ;;
          esac
          docker run --rm -e URL="$URL" postgres:17 sh -c 'pg_dump "$URL" --schema=public --no-owner --no-privileges' > aprflow.sql
          test -s aprflow.sql
      - name: Criptografar
        env:
          SENHA: ${{ secrets.BACKUP_SENHA }}
        run: |
          if [ -z "$SENHA" ]; then echo "::error::O segredo BACKUP_SENHA não está cadastrado. Cadastre uma senha em Settings → Secrets and variables → Actions e rode de novo."; exit 1; fi
          gzip -9 aprflow.sql
          gpg --batch --yes --pinentry-mode loopback --passphrase "$SENHA" --symmetric --cipher-algo AES256 -o "aprflow-$(date +%Y-%m-%d).sql.gz.gpg" aprflow.sql.gz
          rm aprflow.sql.gz
      - name: Guardar o backup
        uses: actions/upload-artifact@v4
        with:
          name: backup-aprflow
          path: aprflow-*.sql.gz.gpg
          retention-days: 90
