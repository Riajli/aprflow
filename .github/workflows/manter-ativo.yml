# Mantém o projeto Supabase gratuito ativo (evita a pausa por inatividade).
# Precisa dos segredos SUPABASE_URL e SUPABASE_ANON_KEY no repositório.
name: Manter Supabase ativo
on:
  schedule:
    - cron: "17 11 * * *"   # todo dia às 08:17 (Brasília)
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar a função ping
        run: |
          curl -sf -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/ping" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" -d '{}'
